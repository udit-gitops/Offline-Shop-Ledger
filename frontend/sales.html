<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales · Shop Ledger</title>
  <meta name="theme-color" content="#163d30">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="sales">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <header class="page-head">
        <div>
          <h1>New sale</h1>
          <p>Tap a product to add it to the bill.</p>
        </div>
      </header>

      <!-- On a phone the order is: products, bill, today's sales.
           On a wide screen the bill sits on the right (see .sales-grid in style.css). -->
      <div class="sales-grid">
        <section class="card area-products">
          <div class="card-head">
            <h2>Products</h2>
            <input type="search" class="search" id="search" placeholder="Search products" aria-label="Search products">
          </div>
          <div class="card-body" id="pickBox"></div>
        </section>

        <section class="card area-bill">
          <div class="card-head"><h2>Bill</h2></div>
          <div class="table-wrap" id="billBox"></div>
          <div class="bill-total"><span>Total</span><strong id="billTotal">₹0</strong></div>

          <form class="card-body" id="saleForm" novalidate>
            <div class="form-error" id="formError" hidden></div>
            <div class="field">
              <label for="customer">Customer</label>
              <div class="inline-form">
                <select id="customer"></select>
                <button type="button" class="btn" id="newCustomerBtn">New</button>
              </div>
            </div>
            <div class="field">
              <label for="paid">Amount paid now (₹)</label>
              <div class="inline-form">
                <input id="paid" type="number" min="0" step="0.01" inputmode="decimal">
                <button type="button" class="btn" id="fullBtn">Full</button>
                <button type="button" class="btn" id="creditBtn">Credit</button>
              </div>
            </div>
            <div class="due-line"><span class="muted">Goes to customer's dues</span><b id="dueAmount">₹0</b></div>
            <button type="submit" class="btn btn-primary btn-block" id="saveBtn">Save sale</button>
          </form>
        </section>

        <section class="card area-today">
          <div class="card-head"><h2>Today's sales</h2></div>
          <div class="table-wrap" id="todayBox"></div>
        </section>
      </div>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/db.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sales.js"></script>
</body>
</html>
