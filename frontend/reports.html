<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports · Shop Ledger</title>
  <meta name="theme-color" content="#163d30">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reports">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <header class="page-head">
        <div>
          <h1>Reports</h1>
          <p>Daily sales and pending customer dues.</p>
        </div>
        <div>
          <label for="day">Report date</label>
          <input type="date" id="day">
        </div>
      </header>

      <section class="stats" aria-label="Daily summary">
        <div class="card stat">
          <div class="stat-label">Sales count</div>
          <div class="stat-value" id="rCount">–</div>
          <div class="stat-note" id="rDate"></div>
        </div>
        <div class="card stat">
          <div class="stat-label">Total sales value</div>
          <div class="stat-value" id="rTotal">–</div>
          <div class="stat-note" id="rCredit"></div>
        </div>
        <div class="card stat">
          <div class="stat-label">Money received</div>
          <div class="stat-value" id="rReceived">–</div>
          <div class="stat-note">At billing + dues collected that day</div>
        </div>
        <div class="card stat" id="rDuesCard">
          <div class="stat-label">Pending dues (as of now)</div>
          <div class="stat-value" id="rDues">–</div>
          <div class="stat-note" id="rDuesNote"></div>
        </div>
      </section>

      <div class="stack">
        <section class="card">
          <div class="card-head"><h2 id="dayTitle">Sales</h2></div>
          <div class="table-wrap" id="dayBox"></div>
        </section>

        <div class="grid-even">
          <section class="card">
            <div class="card-head"><h2>Pending customer dues</h2></div>
            <div class="table-wrap" id="duesBox"></div>
          </section>

          <section class="card">
            <div class="card-head"><h2>Sales in the last 7 days</h2></div>
            <div class="chart-box">
              <canvas id="weekChart" role="img" aria-label="Bar chart of sales value for each of the last 7 days. The same numbers are in the table below."></canvas>
            </div>
            <div class="table-wrap" id="weekBox"></div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/db.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
  <!-- Chart.js is kept as a local file (not a CDN link) so the chart also works offline. -->
  <script src="assets/chart.umd.min.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
